# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    prefer_const_constructors: ignore
    # Suppress common warnings and hints
    dead_code: ignore
    unnecessary_import: ignore
    unused_local_variable: ignore
    unused_element: ignore
    unused_field: ignore
    # Add other warnings and hints you find less useful
    unused_catch_clause: ignore
    unused_catch_stack: ignore
    unused_label: ignore
    unused_shown_name: ignore
    invalid_annotation_target: ignore

linter:
  rules:
    # Disable specific linter rules
    always_declare_return_types: false
    always_specify_types: false
    annotate_overrides: false
    avoid_annotating_with_dynamic: false
    avoid_print: false
    camel_case_types: false
    constant_identifier_names: false
    empty_statements: false
    non_constant_identifier_names: false
    prefer_single_quotes: false
    slash_for_doc_comments: false
    type_init_formals: false
    unnecessary_brace_in_string_interps: false
    unnecessary_getters_setters: false
    unnecessary_new: false
    unnecessary_this: false
    sort_unnamed_constructors_first: false
